name: Build Swiss long-distance timetable

# Runs every Monday (and on demand) and commits data/ch_fv.zip, which the TravelHub backend reads.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build timetable
        run: python scripts/build_ch.py
      - name: Commit if changed
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add data/ch_fv.zip
          git diff --cached --quiet || git commit -m "Update Swiss long-distance timetable"
          git push
